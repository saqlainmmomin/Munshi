[project]
name = "munshi-worker"
version = "0.1.0"
description = "Munshi sourcing worker — scrapers, X poller, intake, dedupe, vision, commute. Owned by Codex (AGENTS.md §2)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",            # X official API (never scrape X — PRD §8.2)
    "playwright>=1.48",       # NoBroker scraping (PRD §8.1)
    "psycopg[binary]>=3.2",   # writes listings to shared Postgres (the contract)
    "anthropic>=0.39",        # photo light/space assessment (PRD §11)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8", "black>=24.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
